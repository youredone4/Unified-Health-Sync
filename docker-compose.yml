# HealthSync production stack: Postgres + app + HTTPS reverse proxy.
#
#   cp .env.example .env      # then fill in every value marked REQUIRED
#   docker compose up -d --build
#
# Only Caddy (ports 80/443) is reachable from outside. The app and the
# database are on a private network with no published ports.
# Full guide: docs/deployment.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TRUST_PROXY: "1"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
      SEMAPHORE_SENDER_NAME: ${SEMAPHORE_SENDER_NAME:-}
      SMS_DAILY_LIMIT_PER_BARANGAY: ${SMS_DAILY_LIMIT_PER_BARANGAY:-}
      PHILHEALTH_API_BASE_URL: ${PHILHEALTH_API_BASE_URL:-}
      PHILHEALTH_API_KEY: ${PHILHEALTH_API_KEY:-}
      PHILHEALTH_PROVIDER_CODE: ${PHILHEALTH_PROVIDER_CODE:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
